name: inventory-ms

services:
  mongo:
    image: mongo:7
    # Listens on 27018, not Mongo's default 27017, because a native,
    # non-Docker MongoDB service commonly already owns 27017 on the host --
    # see docs/LOCAL_SERVICES.md. The replica set's advertised member host
    # must equal mongod's own listening port (mongod self-validates against
    # it on every rs.reconfig()), so the internal and published ports must
    # match -- this can't be solved with a host-side port remap alone.
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27018']
    ports:
      - '27018:27018'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--port', '27018', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-rs-init:
    image: mongo:7
    depends_on:
      - mongo
    volumes:
      - ../mongo/init-replica-set.sh:/init-replica-set.sh:ro
    entrypoint: ['bash', '/init-replica-set.sh']
    restart: 'no'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: localminiosecret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
  minio-data:
  redis-data:
